server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA and the API share top-level paths (/books/:id, /cart, /orders,
    # /admin/books). Splitting on those prefixes would make a pasted URL return
    # JSON instead of a page, so the API lives under /api and is stripped here.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Looser than the app's own 2 MiB cap on purpose, so an oversize upload
        # is refused by BodySizeLimit (JSON body + security headers) rather than
        # bare by nginx.
        client_max_body_size 4m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
